[project]
name = "template-python"
version = "0.1.0"
description = "Torben's Python template project"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.14,<3.15"
dependencies = [
    "python-dotenv>=1.2.4",
    "tzdata>=2026.5",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
    "vulture>=2.16",
]

[tool.pytest.ini_options]
pythonpath = "src"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
omit = ["**/__init__.py", "**/__main__.py"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == \"__main__\":"]

[tool.pyright]
include = ["src"]

[tool.uv]
required-version = "~=0.13.6"
exclude-newer = "7 days"

[tool.vulture]
paths = ["src"]
# exclude = ["src/models.py"]
ignore_names = ["LOGGER"]
