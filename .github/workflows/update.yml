---
name: Update

on:
  schedule:
    - cron: '51 5 * * 6'  # Every Monday morning
  workflow_dispatch:  # Manual trigger
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: true

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Upgrade dependencies
        run: |
          uv lock --upgrade
          uv sync --upgrade

      - name: Run Ruff
        run: |
          uv run ruff check --no-fix --output-format=github
          uv run ruff format --check

      - name: Run prek pre-commit
        uses: j178/prek-action@1382ad72dea72f9d53832f2bcb65b3e87a947204  # v3.0.1
        with:
          extra-args: --all-files --quiet

      - name: Run prek pre-commit autoupdate
        run: |
          prek autoupdate

      - name: Run prek pre-commit
        uses: j178/prek-action@1382ad72dea72f9d53832f2bcb65b3e87a947204  # v3.0.1
        with:
          extra-args: --all-files --quiet

      - name: Commit changes if any
        run: |
          if [[ -z $(git status --porcelain) ]]; then
            echo "No changes to commit"
            exit 0
          fi
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add .pre-commit-config.yaml
          git add uv.lock
          git add pyproject.toml
          git diff --staged --quiet || git commit -m "chore: update packages"
          git push
